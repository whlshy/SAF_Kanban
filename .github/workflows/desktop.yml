# Builds the Windows installer of the desktop app (desktop/), installs it on
# the build machine and checks that the installed app works. The installer is
# kept with the run, under "Artifacts".
#
# To publish a version: set it in desktop/Cargo.toml and merge it into main.
# Then either run this workflow on main from the Actions tab with "Publish a
# release" checked, or push a tag named desktop-v<version> (for example
# desktop-v0.1.0). Either way the run creates the release, and the tag if
# needed, with the installer attached.
name: Desktop app

on:
  push:
    branches: ['**']
    tags: ['desktop-v*']
    paths:
      - desktop/**
      - .github/workflows/desktop.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release (tag desktop-v<version>); only on main
        type: boolean
        default: false

permissions:
  contents: read

# On a working branch, a newer push replaces a run that is still going. On
# main every commit's run finishes, and a release run (started by hand) runs
# beside the one its merge started instead of cancelling it.
concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # to create the release
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Read the version
        id: version
        run: |
          $version = (cargo metadata --manifest-path desktop/Cargo.toml --no-deps --format-version 1 | ConvertFrom-Json).packages.Where({ $_.name -eq 'saf-kanban' }).version
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "desktop-v$version") {
            throw "The tag is $env:GITHUB_REF_NAME, but desktop/Cargo.toml says version $version."
          }

      # The server, the command line and the file locking, on Windows.
      - name: Test the server and the command line
        run: cargo test --manifest-path desktop/Cargo.toml

      - run: npm ci
      - name: Build the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npm run build:local
            node desktop/app/prepare-cli.mjs
            [System.IO.File]::WriteAllText("$PWD/updater-build.json", '{"bundle":{"createUpdaterArtifacts":true}}', (New-Object System.Text.UTF8Encoding $false))
            npx tauri build --config "$PWD/updater-build.json"
          } else {
            npm run build:app
          }

      - name: Install it
        run: |
          $setup = Get-Item desktop/target/release/bundle/nsis/*-setup.exe
          Copy-Item $setup "SAF-Kanban_${{ steps.version.outputs.version }}_x64-setup.exe"
          $sig = Get-Item desktop/target/release/bundle/nsis/*-setup.exe.sig -ErrorAction SilentlyContinue
          if ($sig) {
            Copy-Item $sig "SAF-Kanban_${{ steps.version.outputs.version }}_x64-setup.exe.sig"
          }
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $installed = Join-Path $env:LOCALAPPDATA 'SAF Kanban\saf-kanban.exe'
          if (-not (Test-Path $installed)) { throw "Not installed at $installed" }
          "INSTALLED=$installed" >> $env:GITHUB_ENV

      - name: Check the installed app
        run: node desktop/app/smoke-test.mjs "$env:INSTALLED"

      - uses: actions/upload-artifact@v4
        with:
          name: SAF-Kanban-${{ steps.version.outputs.version }}-windows
          path: SAF-Kanban_*-setup.exe
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag' || (inputs.publish && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # On a tag, that tag; otherwise desktop-v<version>, made on this commit.
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "desktop-v$env:VERSION" }
          $installer = "SAF-Kanban_${env:VERSION}_x64-setup.exe"
          $sigPath = "${installer}.sig"
          $conf = Get-Content desktop/app/tauri.conf.json -Raw | ConvertFrom-Json
          $pubkey = "$($conf.plugins.updater.pubkey)".Trim()
          if ($pubkey -and -not (Test-Path $sigPath)) {
            throw "Updater pubkey is configured in tauri.conf.json, but TAURI_SIGNING_PRIVATE_KEY secret is missing so no .sig file was created."
          }
          $assets = @($installer)
          if (Test-Path $sigPath) {
            $signature = (Get-Content $sigPath -Raw).Trim()
            $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            $manifest = [ordered]@{
              version = $env:VERSION
              notes = "https://github.com/${{ github.repository }}/blob/$tag/CHANGELOG.md"
              pub_date = $pubDate
              platforms = [ordered]@{
                "windows-x86_64" = [ordered]@{
                  signature = $signature
                  url = "https://github.com/${{ github.repository }}/releases/download/$tag/$installer"
                }
              }
            } | ConvertTo-Json -Depth 5
            [System.IO.File]::WriteAllText("$PWD/latest.json", $manifest, (New-Object System.Text.UTF8Encoding $false))
            $assets += "latest.json"
          }
          $notes = @"
          Windows 安裝檔：下載 ``$installer`` 後執行。安裝檔沒有簽章，Windows 會顯示「Windows 已保護您的電腦」，按「其他資訊」→「仍要執行」即可。

          Windows installer: download ``$installer`` and run it. The installer isn't signed, so Windows shows "Windows protected your PC"; choose "More info", then "Run anyway".

          說明 / Guide: https://github.com/${{ github.repository }}/blob/$tag/desktop/README.md
          版本紀錄 / Changelog: https://github.com/${{ github.repository }}/blob/$tag/CHANGELOG.md
          "@
          # From a file, so the quotes in the text reach GitHub as written.
          [System.IO.File]::WriteAllText("$PWD/release-notes.md", $notes, (New-Object System.Text.UTF8Encoding $false))
          gh release create $tag @assets --target $env:GITHUB_SHA --title "SAF Kanban Desktop $env:VERSION" --notes-file release-notes.md
