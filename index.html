<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="x-dns-prefetch-control" content="on">
  <title>SAF Kanban</title>
  <meta name="description" content="Author: WHL">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, user-scalable=0, maximum-scale=1, minimum-scale=1">
  <meta property="og:title" content="SAF Kanban" />
  <meta property="og:description" content="SAF Kanban" />
  <meta property="og:type" content="website" />
</head>

<body>
  <noscript>
    You need to enable JavaScript to run this app.
  </noscript>
  <div id="root" class="cover"></div>
  <script>
    // Apply the theme before React renders so the page doesn't flash.
    // Existing users keep the dark theme; new users follow the system setting.
    (function () {
      var theme = 'dark';
      try {
        var saved = JSON.parse(localStorage.getItem('theme'));
        if (saved === 'light' || saved === 'dark') {
          theme = saved;
        } else {
          var boards = JSON.parse(localStorage.getItem('boards') || '[]');
          var existingUser = localStorage.getItem('sheetId') !== null || boards.length > 0;
          var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          theme = !existingUser && prefersLight ? 'light' : 'dark';
          localStorage.setItem('theme', JSON.stringify(theme));
        }
      } catch (e) {}
      if (theme === 'dark') document.getElementById('root').classList.add('dark');
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
